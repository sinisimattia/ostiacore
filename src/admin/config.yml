# local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: "src/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "events"
    label: "Events"
    folder: "src/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Ticket URL", name: "ticketUrl", widget: "string", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Language", name: "lang", widget: "select", options: ["it", "en"], default: "it" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "announcements"
    label: "News"
    folder: "src/announcements"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "string" }
      - { label: "Language", name: "lang", widget: "select", options: ["it", "en"], default: "it" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Settings"
    files:
      - label: "Site Settings"
        name: "site"
        file: "src/_data/site.json"
        format: "json"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Site URL", name: "url", widget: "string" }
          - { label: "Default Language", name: "lang", widget: "select", options: ["it", "en"], default: "it" }
          - { label: "Description", name: "description", widget: "string" }
          - { label: "Hero Background Image", name: "heroBackground", widget: "image", required: false }
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Direct Message (full URL)", name: "dm", widget: "string", required: false }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Instagram (full URL)", name: "instagram", widget: "string", required: false }
              - { label: "Facebook (full URL)", name: "facebook", widget: "string", required: false }
              - { label: "Spotify (full URL)", name: "spotify", widget: "string", required: false }
              - { label: "YouTube (full URL)", name: "youtube", widget: "string", required: false }
              - { label: "Bandcamp (full URL)", name: "bandcamp", widget: "string", required: false }
              - { label: "TikTok (username)", name: "tiktok", widget: "string", required: false }
              - { label: "SoundCloud (full URL)", name: "soundcloud", widget: "string", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - label: "Contact"
        name: "contact"
        file: "src/contact.njk"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "page.njk" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/contact/" }
          - { label: "Language", name: "lang", widget: "select", options: ["it", "en"], default: "it" }
          - { label: "Body", name: "body", widget: "markdown" }
